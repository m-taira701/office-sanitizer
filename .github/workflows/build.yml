name: Build and Release

on:
  push:
    branches: [ "main", "feat/*" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: OfficeSanitizer.exe
            asset_name: OfficeSanitizer-Windows.exe
          - os: macos-latest
            artifact_name: OfficeSanitizer.bin
            asset_name: OfficeSanitizer-Mac

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python 3.13
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build with PyInstaller (Windows)
        if: runner.os == 'Windows'
        run: |
          python build.py
          # Verify file exists
          if (Test-Path "dist/OfficeSanitizer.exe") { Write-Host "Build Success" } else { exit 1 }

      - name: Build with PyInstaller (Mac)
        if: runner.os == 'macOS'
        run: |
          python build.py
          # Verify file exists
          ls -l dist/OfficeSanitizer.bin

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.artifact_name }}

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: OfficeSanitizer-Windows.exe

      - name: Download Mac Artifact
        uses: actions/download-artifact@v4
        with:
          name: OfficeSanitizer-Mac

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            OfficeSanitizer.exe
            OfficeSanitizer.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
